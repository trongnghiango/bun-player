name: Build & Release Desktop (Windows & Linux)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Phiên bản đóng gói (Ví dụ: v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: desktop_build_${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: BIÊN DỊCH BỘ CÀI WINDOWS (.exe qua NSIS / .msi qua WiX)
  # (Tham khảo kiến trúc từ DentalUXPro/artifacts/admin-portal)
  # =========================================================================
  build-windows:
    name: 🪟 Build Windows Installer (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cài đặt Rust Stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies Rust (Cargo)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cài đặt Dependencies Node
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build ứng dụng Desktop Windows (Tauri v2)
        shell: bash
        run: |
          pnpm run tauri:build

      - name: 1. Lưu trữ File Cài Đặt Windows vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BunPlayer-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bun-player.exe
          if-no-files-found: warn

      - name: 2. Tự động đính kèm file Windows vào GitHub Releases (khi push Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bun-player.exe
          name: Bun Player Release (${{ github.ref_name }})
          draft: false
          prerelease: false
          generate_release_notes: true

  # =========================================================================
  # JOB 2: BIÊN DỊCH BỘ CÀI LINUX (.AppImage / .deb)
  # =========================================================================
  build-linux:
    name: 🐧 Build Linux Package (.AppImage / .deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Thư viện Hệ thống Cần thiết cho WebKitGTK & Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cài đặt Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies Rust (Cargo)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cài đặt Dependencies Node
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build ứng dụng Desktop Linux (Tauri v2)
        run: |
          pnpm run tauri:build

      - name: 1. Lưu trữ File Cài Đặt Linux vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BunPlayer-Linux-Package
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: 2. Tự động đính kèm file Linux vào GitHub Releases (khi push Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          name: Bun Player Release (${{ github.ref_name }})
          draft: false
          prerelease: false
          generate_release_notes: true
